<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Jogos e Resultados</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
      background-color: #f4f6f9;
    }
    h1, h2 { text-align: center; color: #333; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .form-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      flex: 1;
      min-width: 120px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-add { background-color: #28a745; color: white; }
    .btn-publish { background-color: #007bff; color: white; width: 100%; font-size: 16px; margin-top: 10px; }
    .btn-delete { background-color: #dc3545; color: white; padding: 5px 10px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th { background-color: #343a40; color: white; }
    .score-input { width: 50px; text-align: center; }
  </style>
</head>
<body>

  <h1>Painel de Jogos e Resultados</h1>

  <!-- Formulário para Adicionar Novo Jogo -->
  <div class="card">
    <h2>Criar Novo Jogo</h2>
    <div class="form-group">
      <input type="text" id="equipa1" placeholder="Equipa Casa">
      <input type="text" id="equipa2" placeholder="Equipa Fora">
      <input type="date" id="dataJogo">
      <button class="btn-add" onclick="adicionarJogo()">Adicionar Jogo</button>
    </div>
  </div>

  <!-- Tabela de Jogos -->
  <div class="card">
    <h2>Tabela de Jogos</h2>
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Equipa Casa</th>
          <th>Resultado</th>
          <th>Equipa Fora</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaJogos">
        <!-- Jogos serão inseridos aqui via JavaScript -->
      </tbody>
    </table>

    <button class="btn-publish" onclick="publicarAlteracoes()">🚀 Publicar Alterações na Net</button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- O teu script principal -->
  <script src="script.js"></script>
</body>
</html>
